<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Event Controls | Learning JavaScript</title>
    <meta name="description"
        content="An interactive premium HTML template featuring modern buttons for JavaScript event listener practice.">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-success: #4ade80;
            --accent-danger: #fb7185;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 3rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .btn {
            position: relative;
            padding: 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #btn-1 {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
        }

        #btn-2 {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        #btn-3 {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3);
        }

        #btn-4 {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            box-shadow: 0 10px 15px -3px rgba(244, 63, 94, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 1.8rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtle floating animation for the background gradients */
        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, 20px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Event Master</h1>
        <p>Interactive Control Panel</p>

        <div class="button-grid">
            <button id="btn-1" class="btn">
                <span>Action One</span>
            </button>
            <button id="btn-2" class="btn">
                <span>Action Two</span>
            </button>
            <button id="btn-3" class="btn">
                <span>Success Trigger</span>
            </button>
            <button id="btn-4" class="btn">
                <span>Danger Zone</span>
            </button>
        </div>
    </main>

    <script>
        document.querySelector(".button-grid").addEventListener("click", (e) => {
            console.log("Button Grid Cliked !!!")
            console.log(e.target)
            let rm = e.target
            rm.remove()
        })
        document.getElementById("btn-1").addEventListener("click", (e) => {
            console.log("Button 1 clicked");
            // alert("Clicked Correct!!")
            e.stopPropagation()
            e.preventDefault()
        })
        document.getElementById("btn-2").addEventListener("click", () => {
            alert("Clicked Correct!!")
        })
        document.getElementById("btn-3").addEventListener("click", () => {
            alert("Clicked Correct!!")
        })
        document.getElementById("btn-4").addEventListener("click", () => {
            alert("Clicked Dangered!")
        })
    </script>
</body>

</html>
