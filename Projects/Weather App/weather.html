<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Weather — Minimalist Atmospheric Forecast</title>
  
  <!-- Premium Typography: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ----------------------------------------------------
       1. Design System & CSS Variables
    ---------------------------------------------------- */
    :root {
      /* Palette */
      --bg-dark: #0a0e17;
      --card-bg: rgba(25, 30, 48, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(99, 102, 241, 0.15);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-indigo: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      
      --glow-indigo: rgba(99, 102, 241, 0.25);
      --glow-cyan: rgba(6, 182, 212, 0.25);
      
      /* Typography */
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      
      /* Transitions */
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* ----------------------------------------------------
       2. Base Reset & Layout
    ---------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 2rem 1.5rem;
    }

    /* Ambient Background Blobs (Premium Glow Effect) */
    .bg-glow-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      mix-blend-mode: screen;
      animation: float-blob 20s infinite alternate ease-in-out;
    }

    .bg-blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-indigo) 0%, transparent 70%);
      top: -10%;
      left: -10%;
    }

    .bg-blob-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
      bottom: -15%;
      right: -10%;
      animation-delay: -5s;
      animation-duration: 25s;
    }

    .bg-blob-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--accent-rose) 0%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.08;
      animation-delay: -8s;
    }

    @keyframes float-blob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -60px) scale(1.1); }
      100% { transform: translate(-30px, 30px) scale(0.9); }
    }

    /* ----------------------------------------------------
       3. Main App Container
    ---------------------------------------------------- */
    .weather-app-wrapper {
      width: 100%;
      max-width: 460px;
      position: relative;
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ----------------------------------------------------
       4. Premium Search Bar UI
    ---------------------------------------------------- */
    .search-section {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-bar-container {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 0.5rem 0.5rem 0.5rem 1.25rem;
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      transition: var(--transition-smooth);
    }

    .search-bar-container:focus-within {
      border-color: var(--accent-indigo);
      box-shadow: 0 10px 35px -10px rgba(99, 102, 241, 0.25),
                  0 0 0 1px rgba(99, 102, 241, 0.2),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    .search-icon {
      color: var(--text-muted);
      margin-right: 0.75rem;
      flex-shrink: 0;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
    }

    .search-bar-container:focus-within .search-icon {
      color: var(--accent-indigo);
      transform: scale(1.05);
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      cursor: pointer;
      border-radius: 14px;
      padding: 0.65rem;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 0.4rem;
      outline: none;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.15);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    /* ----------------------------------------------------
       5. Beautiful Weather Card
    ---------------------------------------------------- */
    .weather-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      padding: 2.25rem;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    .weather-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    }

    /* Ambient card interior glow based on active weather state */
    .weather-card-glow {
      position: absolute;
      top: -30%;
      right: -30%;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-indigo) 0%, transparent 70%);
      filter: blur(50px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      transition: var(--transition-smooth);
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    /* --- City & Date Header --- */
    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .location-details {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .city-name-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .city-name {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
    }

    .country-badge {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .date-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .weather-state-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    /* --- Hero Temperature & Visual --- */
    .hero-weather-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }

    .temperature-box {
      display: flex;
      flex-direction: column;
    }

    .temperature-wrapper {
      display: flex;
      align-items: flex-start;
    }

    .temperature-num {
      font-family: var(--font-display);
      font-size: 4.75rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--text-primary) 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .temperature-unit {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 600;
      color: var(--accent-cyan);
      line-height: 1.2;
      margin-top: 0.2rem;
    }

    .weather-desc-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 0.4rem;
      letter-spacing: -0.01em;
      text-transform: capitalize;
    }

    /* Floating Weather Icon Container */
    .hero-icon-container {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Subtle animation on the weather icon to give it life */
    .weather-icon {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(99, 102, 241, 0.3));
      animation: float-icon 5s infinite ease-in-out;
    }

    @keyframes float-icon {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    /* SVGs Cloud animations */
    .svg-glow-element {
      filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8));
    }
    
    .svg-anim-pulse {
      animation: pulse-element 3s infinite alternate ease-in-out;
    }

    .svg-anim-spin {
      animation: spin-element 25s infinite linear;
      transform-origin: center;
    }

    @keyframes pulse-element {
      0% { opacity: 0.85; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    @keyframes spin-element {
      100% { transform: rotate(360deg); }
    }

    /* --- Detailed Metrics Grid --- */
    .metrics-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0) 100%);
      margin-bottom: 2rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      transition: var(--transition-smooth);
    }

    .metric-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.3);
    }

    .metric-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }

    .metric-card:hover .metric-icon-box {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-indigo);
    }

    /* Make second column hover glow colored differently */
    .metric-card:nth-child(2):hover .metric-icon-box {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
    }
    
    .metric-card:nth-child(3):hover .metric-icon-box {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
    }

    .metric-card:nth-child(4):hover .metric-icon-box {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
    }

    .metric-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .metric-value {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ----------------------------------------------------
       6. Entry Animations
    ---------------------------------------------------- */
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      
      .weather-card {
        padding: 1.75rem;
        border-radius: 28px;
      }

      .city-name {
        font-size: 1.6rem;
      }

      .temperature-num {
        font-size: 4rem;
      }

      .hero-icon-container {
        width: 95px;
        height: 95px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Backdrop Glows -->
  <div class="bg-glow-container">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
  </div>

  <!-- Main Application Wrapper -->
  <div class="weather-app-wrapper">

    <!-- 1. Beautiful Search Bar -->
    <header class="search-section">
      <div class="search-bar-container">
        <!-- Search Magnifier Icon -->
        <span class="search-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <!-- City Input Element (Interactive ID ready) -->
        <input 
          type="text" 
          id="city-input" 
          class="search-input" 
          placeholder="Search for a city..." 
          autocomplete="off"
          spellcheck="false"
        >
        <!-- Search Button (Interactive ID ready) -->
        <button id="search-btn" class="action-btn" aria-label="Search city">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <!-- Current Location Button (Interactive ID ready) -->
        <button id="location-btn" class="action-btn" aria-label="Use current location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. Premium Weather Card -->
    <main class="weather-card" id="weather-card">
      <!-- Reactive Card Glow layer -->
      <div class="weather-card-glow" id="weather-card-glow"></div>

      <div class="card-content">
        <!-- Location details & Pill badge -->
        <div class="location-header">
          <div class="location-details">
            <div class="city-name-wrapper">
              <span class="city-name" id="city-name">Tokyo</span>
              <span class="country-badge" id="country-code">JP</span>
            </div>
            <span class="date-text" id="current-date">Tuesday, 19 May</span>
          </div>
          <div class="weather-state-pill" id="weather-condition-pill">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="svg-anim-pulse">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="condition-pill-text">Showers</span>
          </div>
        </div>

        <!-- Hero weather statistics -->
        <div class="hero-weather-display">
          <div class="temperature-box">
            <div class="temperature-wrapper">
              <span class="temperature-num" id="temp-value">19</span>
              <span class="temperature-unit">°C</span>
            </div>
            <span class="weather-desc-text" id="weather-desc">Scattered rain showers</span>
          </div>

          <!-- Main visual interactive weather icon -->
          <div class="hero-icon-container">
            <img id="weather-icon" class="weather-icon" src="https://cdn.weatherapi.com/weather/64x64/day/116.png" alt="Weather Status">
          </div>


        <div class="metrics-divider"></div>

        <!-- 3. Bottom Grid with City and Temperature Details -->
        <div class="metrics-grid">
          
          <!-- Feels Like -->
          <div class="metric-card">
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Feels Like</span>
              <span class="metric-value" id="feels-like-val">20°C</span>
            </div>
          </div>

          <!-- Humidity -->
          <div class="metric-card">
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Humidity</span>
              <span class="metric-value" id="humidity-val">74%</span>
            </div>
          </div>

          <!-- Wind Speed -->
          <div class="metric-card">
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Wind Speed</span>
              <span class="metric-value" id="wind-val">12 km/h</span>
            </div>
          </div>

          <!-- Air Pressure -->
          <div class="metric-card">
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Pressure</span>
              <span class="metric-value" id="pressure-val">1012 hPa</span>
            </div>
          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- Connected Javascript File (User's Workspace File) -->
  <script src="weather.js" defer></script>

</body>
</html>
