<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="insert">
        <h1>Key is pressed</h1>
    </div>
</body>
<script>
    window.addEventListener("keydown", (e) => {
        document.querySelector("#insert").innerHTML += `<div> ${e.key}, ${e.code}</div>`
    })
</script>

</html>
